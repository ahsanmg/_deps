name: Main

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options:
          - onnxruntime

      version:
        description: "Version/Branch/Tag"
        required: true
        type: string

      features:
        description: "Features"
        type: string

concurrency:
  group: monthly-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.month.outputs.tag }}

    steps:
      - name: Determine monthly tag
        id: month
        shell: bash
        run: |
          TAG="$(date -u +'%Y.%m')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Monthly tag: $TAG"

      - name: Ensure monthly release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.month.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Monthly dependency build artifacts for $TAG"
          fi

  build-onnxruntime:
    needs: prepare-release
    if: inputs.package == 'onnxruntime'
    uses: ./.github/workflows/build-ort.yml
    with:
      version: ${{ inputs.version }}
      eps: ${{ inputs.features }}
      monthly-tag: ${{ needs.prepare-release.outputs.tag }}
    secrets: inherit